# =====================================================================
# Codemagic: 맥 없이 클라우드 맥에서 아이폰 앱을 만들고 TestFlight에 올려요
# 처음 한 번만 Codemagic 화면에서 할 일
#   1) Teams → Integrations → Developer Portal 에 App Store Connect API 키 연결
#      (그 연결 이름을 아래 integrations.app_store_connect 에 그대로 적어요)
#   2) 이 저장소(GitHub)를 Codemagic 앱으로 추가하고 'ios-testflight' 워크플로 실행
# =====================================================================
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: GodsaengFighter API   # ← Codemagic에 등록한 API 키 이름과 똑같이
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.godsaengfighter.app
      node: latest
      xcode: latest
    triggering:
      events: []            # 자동 실행 안 함 (Codemagic에서 버튼으로 시작)
    scripts:
      - name: npm 설치
        script: |
          npm install
          npm install @supabase/supabase-js --no-save
          mkdir -p www/lib
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/lib/supabase.js || echo "supabase.js 복사 실패 → 앱이 인터넷에서 불러와요"

      - name: iOS 프로젝트 만들기 (처음이면)
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      - name: 앱 아이콘, 권한 문구, 버전 넣기
        script: |
          PLIST=ios/App/App/Info.plist
          set_plist () { /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$1 $3 $2" "$PLIST"; }
          set_plist NSCameraUsageDescription "운동 인증 사진을 찍고 공부 라이브 화면을 보여주기 위해 카메라를 사용해요. 영상은 저장·전송되지 않아요." string
          set_plist NSPhotoLibraryUsageDescription "앨범에 있는 운동 인증 사진을 고를 때 사진에 접근해요. 사진은 기기 밖으로 전송되지 않아요." string
          set_plist ITSAppUsesNonExemptEncryption false bool
          # 아이폰 전용 앱으로 (아이패드 스크린샷이 필요 없어요)
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = 1/g' ios/App/App.xcodeproj/project.pbxproj
          ICONDIR=ios/App/App/Assets.xcassets/AppIcon.appiconset
          for f in "$ICONDIR"/*.png; do cp resources/icon-1024.png "$f"; done
          cd ios/App
          agvtool new-marketing-version 1.0.0
          agvtool new-version -all $BUILD_NUMBER

      - name: 서명 설정
        script: |
          xcode-project use-profiles

      - name: 아이폰 앱(ipa) 만들기
        script: |
          cd ios/App
          if [ -d App.xcworkspace ]; then
            xcode-project build-ipa --workspace App.xcworkspace --scheme App
          else
            xcode-project build-ipa --project App.xcodeproj --scheme App
          fi
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
