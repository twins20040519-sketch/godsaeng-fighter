<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GODSAENG FIGHTER</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Do+Hyeon&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== 꾸미기 1: 색과 글꼴은 여기만 바꾸면 앱 전체가 바뀌어요 ===== */
:root{
  --bg:#0d0a2a;      /* 배경 */
  --panel:#1b1650;   /* 카드 배경 */
  --ink:#f4f1ff;     /* 글자 */
  --sub:#a59fd6;     /* 보조 글자 */
  --red:#e63a2e;     /* 체력바 바탕, 포인트 */
  --yel:#ffd23f;     /* 강조 (제목, 버튼) */
  --cyan:#38d6ff;    /* 보조 강조 */
  --line:#3a3392;    /* 테두리 */
  --font-title:"Do Hyeon","Noto Sans KR",sans-serif;
  --font-pixel:"Press Start 2P","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:linear-gradient(180deg,var(--bg) 0%,#2b1659 60%,#5a1d4a 100%);background-attachment:fixed;color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 100px}
.px{font-family:var(--font-pixel)}
h1{font-family:var(--font-title);font-weight:400;font-size:40px;line-height:1.1;margin:0 0 4px;color:var(--yel);text-shadow:3px 3px 0 var(--red),6px 6px 0 #000}
h2{font-family:var(--font-title);font-weight:400;font-size:22px;margin:18px 0 10px;color:var(--cyan)}
.sub{color:var(--sub);font-size:13px;margin:8px 0}
.card{background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 #000;padding:14px;margin-bottom:12px}
.btn,button.pk{font:inherit;font-weight:700;font-size:15px;border:3px solid #000;background:var(--yel);color:#000;padding:9px 14px;cursor:pointer;box-shadow:3px 3px 0 #000}
.btn.alt{background:var(--ink)}
input[type=text],input[type=time],input[type=number]{font:inherit;width:100%;padding:9px;margin:6px 0 10px;border:3px solid #000;background:var(--ink);color:#000}
label{font-size:13px;color:var(--sub);display:block}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cam{display:block;width:100%;aspect-ratio:4/3;background:#000;border:3px solid #000;object-fit:cover;transform:scaleX(-1)}
button.pk{background:var(--panel);color:var(--ink);border-color:var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 4px}
button.pk[aria-pressed=true]{border-color:var(--yel);background:#2d2480}
.pk .ic{font-size:38px;line-height:1.1}
.pk .px{font-size:7px}
.pk.lock .ic{filter:grayscale(1);opacity:.55}
.mem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed var(--line)}
.mem:last-child{border:0}
.mem .av{font-size:26px}
.rk{display:grid;grid-template-columns:34px 1fr auto 52px;gap:6px;align-items:center;padding:8px 6px;border-bottom:2px dashed var(--line);font-size:14px}
.rk.me{background:#2d2480;border:2px solid var(--yel)}
.rk b{font-family:var(--font-pixel);font-size:11px;color:var(--cyan)}
.rk .pt{color:var(--yel);font-weight:700;text-align:right}
.bars{display:grid;grid-template-columns:1fr 36px 1fr;gap:8px}
.hp{height:22px;background:var(--red);border:3px solid #fff;box-shadow:3px 3px 0 #000;display:flex}
.hp.l{justify-content:flex-end}
.hp i{display:block;height:100%;background:var(--yel);transition:width .6s steps(8)}
.nm{font-family:var(--font-pixel);font-size:8px;margin-top:6px}
.nm.r{text-align:right}
.ring{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;text-align:center;margin:16px 0 8px;border-bottom:4px solid #000;padding-bottom:10px}
.ft{font-size:64px;line-height:1}
.ft.me{display:inline-block}
.art{display:block;margin:0 auto;overflow:visible}
.vs{font-family:var(--font-pixel);font-size:18px;color:var(--red);text-shadow:2px 2px 0 #000;padding:0 6px 14px}
/* 배틀 애니메이션 */
.ring{position:relative}
.fx{display:inline-block}
.fx.rv{transform:scaleX(-1)}
.fx .bd{display:block;animation:idle .8s steps(2) infinite}
.fx.rv:not(.atk):not(.hit):not(.cast) .bd{animation-delay:-.4s}
.fx.atk .bd{animation:atk .5s steps(5)}
.fx.cast .bd{animation:cast .6s steps(4)}
.fx.hit .bd{animation:hit .45s steps(6)}
@keyframes idle{50%{transform:translateY(-4px)}}
@keyframes atk{0%{transform:none}35%,60%{transform:translate(46px,-8px)}100%{transform:none}}
@keyframes cast{0%{transform:none}30%{transform:translateX(-8px)}50%,80%{transform:translateX(10px)}100%{transform:none}}
@keyframes hit{0%,100%{transform:none;filter:none}20%,60%{transform:translateX(-14px) rotate(-6deg);filter:brightness(2.5)}40%,80%{transform:translateX(-8px);filter:none}}
.ball{position:absolute;bottom:52px;left:28%;width:18px;height:18px;background:var(--cyan);border:3px solid #fff;box-shadow:0 0 0 3px #000,0 0 14px var(--cyan);opacity:0;pointer-events:none}
.ball.go-r{animation:ballr .45s steps(6)}
.ball.go-l{animation:balll .45s steps(6)}
@keyframes ballr{from{left:28%;opacity:1}to{left:66%;opacity:1}}
@keyframes balll{from{left:66%;opacity:1}to{left:28%;opacity:1}}
.pow{position:absolute;top:0;font-family:var(--font-pixel);font-size:15px;color:var(--yel);text-shadow:2px 2px 0 var(--red),4px 4px 0 #000;opacity:0;pointer-events:none}
.pow.sp{color:var(--cyan);font-size:18px}
.pow.r{right:8%}.pow.l{left:8%}
.pow.on{animation:pow .6s steps(6)}
@keyframes pow{0%{opacity:1;transform:scale(.4)}30%{opacity:1;transform:scale(1.3) rotate(-8deg)}100%{opacity:0;transform:translateY(-14px)}}
.ring.shake{animation:shake .3s steps(4)}
@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,0)}}
.hp.flash{animation:flash .3s steps(2)}
@keyframes flash{50%{border-color:var(--yel);filter:brightness(1.8)}}
@media (prefers-reduced-motion:reduce){.fx .bd,.fx.atk .bd,.fx.cast .bd,.fx.hit .bd,.ring.shake,.ball.go-r,.ball.go-l{animation:none!important}}
/* 책벌레: 진행률 */
.bkt{font-family:var(--font-title);font-size:22px;color:var(--ink);margin-bottom:8px}
.bkbar{height:22px;background:#000;border:3px solid #fff;box-shadow:3px 3px 0 #000}
.bkbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--cyan) 0 10px,#1fa8d6 10px 12px);transition:width .6s steps(8)}
.bkn{margin-top:8px;font-size:14px}
.bkn b{font-family:var(--font-pixel);font-size:13px;color:var(--cyan)}
/* 배틀 방식 */
.row{display:flex;gap:8px;align-items:center}
.row input{margin:6px 0;flex:1;min-width:0}
.mic{font-size:34px}
.mt{font-size:9px;color:var(--cyan)}
.code{text-align:center}
.cd{font-size:22px;color:var(--yel);letter-spacing:2px;margin:6px 0 12px;text-shadow:2px 2px 0 #000}
.mini{gap:6px}
.mm{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 2px;border:2px solid var(--line);text-align:center;word-break:keep-all}
.mm.me{border-color:var(--yel);background:#2d2480}
.match{text-align:center}
.mrow{display:flex;justify-content:center;align-items:center;gap:18px;margin:14px 0}
.match .q{font-family:var(--font-pixel);font-size:40px;color:var(--sub);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.shot{display:inline-block;position:relative;color:#000;font-size:15px;margin-top:4px}
.shot input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.shot:focus-within{outline:3px solid var(--cyan);outline-offset:2px}
/* 연속 인증 스트릭 */
.stk{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:#000;border:2px solid var(--line);padding:5px 10px;margin:0 0 6px;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.stk.warn{border-color:var(--red);box-shadow:3px 3px 0 var(--red)}
.stk.ok{border-color:var(--yel);box-shadow:3px 3px 0 var(--yel)}
.stk.gift{background:var(--yel);color:#000;border-color:#000;box-shadow:3px 3px 0 #000}
.stk b{font-family:var(--font-pixel);font-size:11px;color:var(--yel)}
.stk.gift b{color:#000}
.flame{display:inline-block;animation:flick .5s steps(2) infinite}
@keyframes flick{50%{transform:scale(1.15) rotate(-6deg)}}
.stkc .flame{font-size:46px}
.big2{font-family:var(--font-title);font-size:32px;line-height:1.1;color:var(--yel);text-shadow:2px 2px 0 #000}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 4px;text-align:center;font-size:11px;color:var(--sub)}
.wk i{display:grid;place-items:center;aspect-ratio:1;margin-top:4px;border:2px solid var(--line);font-style:normal;font-size:14px;color:#000}
.wk i.on{background:var(--yel);border-color:#000}
.wk i.td{outline:2px dashed var(--yel);outline-offset:1px}
.nx{margin-top:12px;font-size:13px}
.nxbar{height:14px;background:#000;border:2px solid #fff;margin-top:6px}
.nxbar i{display:block;height:100%;background:var(--red)}
.ms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ms div{border:2px solid var(--line);padding:8px 4px;text-align:center;font-size:12px;background:var(--panel)}
.ms div.got{border-color:var(--yel)}
.ms b{display:block;font-family:var(--font-pixel);font-size:10px;color:var(--cyan);margin-bottom:4px}
.ms .btn{font-size:12px;padding:4px 8px;margin-top:4px}
@media (prefers-reduced-motion:reduce){.flame{animation:none}}
/* 오늘의 현황판 */
.sumc{display:flex;align-items:center;gap:12px}
.sumc .big2{font-size:28px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.seg i{height:10px;border:2px solid #000;background:var(--line)}
button.pk.dash{align-items:flex-start;text-align:left;padding:12px 10px;gap:2px;border-left-width:8px}
button.pk.dash.done{background:#241d6b}
.dash .ic{font-size:30px}
.dash .st{font-size:14px;color:var(--yel);margin-top:4px}
.dash .st.no{color:var(--sub);font-weight:500}
.dash .st.run{color:var(--red)}
.dash .rm{font-size:11px;color:var(--sub);font-weight:500}
.timer{font-family:var(--font-pixel);font-size:22px;text-align:center;margin:10px 0;color:var(--yel)}
.prev{width:100%;aspect-ratio:4/3;object-fit:cover;border:3px solid #000;margin:6px 0}
.share{text-align:center;padding:22px 12px;border:4px solid var(--yel);background:linear-gradient(160deg,var(--panel),#5a1d4a);box-shadow:6px 6px 0 #000}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.dow{text-align:center;font-size:11px;color:var(--sub)}
.day{position:relative;aspect-ratio:1;padding:0;border:2px solid transparent;background:transparent;color:var(--ink);cursor:pointer}
.day svg{display:block;width:100%;height:100%}
.day span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700}
.day.today{border-color:var(--yel)}
.day.sel{background:#2d2480}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;border:2px solid #000}
.rk2{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.rk2 i{width:12px;height:12px;border:2px solid #000;flex:none}
.rch{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rbig{margin-left:auto;font-family:var(--font-title);font-size:22px;color:var(--yel)}
.share .big{font-family:var(--font-title);font-size:40px;color:var(--yel);text-shadow:3px 3px 0 #000}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:#000}
nav button{flex:1;max-width:90px;font:inherit;font-size:12px;font-weight:700;padding:8px 2px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
nav button[aria-current=page]{background:var(--yel);color:#000;border-color:var(--yel)}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1 id="appName"></h1>
  <p class="sub px" style="font-size:9px">TODAY BATTLE</p>
  <button class="stk" id="stk" data-go="my"></button>
  <div id="app"></div>
</main>
<nav id="nav">
  <button data-go="chars">캐릭터</button><button data-go="pick">오늘</button><button data-go="room">방</button><button data-go="proof">인증</button><button data-go="battle">배틀</button><button data-go="result">결과</button><button data-go="my">마이</button>
</nav>
<script>
/* ===== 꾸미기 2: 앱 이름, 종목 이름·아이콘, 승점, 문구는 여기서 바꿔요 ===== */
const CONFIG = {
  appName: 'GODSAENG FIGHTER',
  // 배틀 방식: points = 1위, 2위, 3위 … 순서의 승점 (끝 숫자는 그 아래 모두), winRank = 이 순위 안이면 '승'
  modes: {
    friend: {icon:'👥', en:'FRIENDS',   ko:'친구방',   desc:'방을 만들고 코드를 보내서 친구끼리 겨뤄요.', points:[5, 3, 2, 1], winRank:2, max:10},
    duel:   {icon:'⚔️', en:'1 VS 1',    ko:'랜덤 1:1', desc:'같은 종목을 고른 모르는 누군가와 1대1로 붙어요.', points:[5, 1], winRank:1},
    royale: {icon:'🔥', en:'BATTLE 11', ko:'10인 난투', desc:'같은 종목의 모르는 10명과 한 번에 붙어요.', points:[10, 7, 5, 3, 2, 1], winRank:3, size:10}
  },
  coinPerPoint: 10,                 // 승점 1점당 받는 게임 코인
  // 연속 인증 보너스: days일 연속을 처음 달성하면 coin만큼 받아요 (하루에 한 종목이라도 인증하면 그날은 성공)
  streak: [{days:3, coin:30}, {days:7, coin:100}, {days:14, coin:200}, {days:30, coin:500}, {days:50, coin:800}, {days:100, coin:1500}],
  // 캐릭터 목록: price가 0이면 처음부터 쓸 수 있어요. look의 색을 바꾸면 모습이 달라져요 (hairStyle: spiky, short, ponytail, hood / acc: ears, horns, crown, cape, scarf, stripes).
  characters: [
    {id:'rookie', name:'ROOKIE', ko:'기본 도전자', price:0,
     look:{skin:'#f0c19a', gi:'#f5f5f5', belt:'#2fa04e', glove:'#2fa04e', hair:'#1b1b1b', hairStyle:'spiky', band:'#2fa04e', shoe:'#333', acc:[]}},
    {id:'ninja', name:'KAGE', ko:'그림자 닌자', price:50,
     look:{skin:'#e0b088', gi:'#2a3358', belt:'#111', glove:'#555', hair:'#2a3358', hairStyle:'hood', band:null, shoe:'#111', acc:['scarf']}},
    {id:'wolf', name:'WOLF', ko:'외로운 늑대', price:120,
     look:{skin:'#d9a47a', gi:'#6b5a4a', belt:'#e07a2d', glove:'#e0a02d', hair:'#9aa3ad', hairStyle:'spiky', band:null, shoe:'#2b2018', acc:['ears']}},
    {id:'tiger', name:'TIGER', ko:'호랑이', price:200,
     look:{skin:'#e8b48a', gi:'#f08a1c', belt:'#111', glove:'#fdf2d0', hair:'#f08a1c', hairStyle:'spiky', band:'#111', shoe:'#111', acc:['stripes']}},
    {id:'panda', name:'PANDA', ko:'쿵푸 판다', price:250,
     look:{skin:'#f4f4f4', gi:'#262626', belt:'#f4f4f4', glove:'#262626', hair:'#262626', hairStyle:'short', band:null, shoe:'#262626', acc:['ears']}},
    {id:'dragon', name:'DRAGON', ko:'용', price:300,
     look:{skin:'#c98f6b', gi:'#1f9e7a', belt:'#f2c14e', glove:'#f2c14e', hair:'#111', hairStyle:'ponytail', band:null, shoe:'#143d33', acc:['horns']}},
    {id:'phoenix', name:'PHOENIX', ko:'불사조', price:400,
     look:{skin:'#e8b48a', gi:'#d6361f', belt:'#ffd23f', glove:'#ffd23f', hair:'#ff9a1f', hairStyle:'ponytail', band:'#ffd23f', shoe:'#5a1208', acc:['cape']}},
    {id:'king', name:'KING', ko:'갓생 왕', price:500,
     look:{skin:'#f0c19a', gi:'#6a2fa0', belt:'#f2c14e', glove:'#f2c14e', hair:'#7a4a1e', hairStyle:'short', band:null, shoe:'#2a1240', acc:['crown','cape']}}
  ],
  cap: {book: 60, iron: 90, study: 240},        // 체력바가 가득 차는 기준 (책벌레는 쪽, 나머지는 분)
  types: {
    dawn: {icon:'🌅', color:'#ffd23f', en:'DAWN',     ko:'새벽러', unit:'기상 시각', close:'전날 밤 23:00', settle:'오전 10:00',
           how:'일어나면 기상 인증 버튼을 눌러요. 실제 서비스에선 서버가 시각을 기록하고, 간단한 미션을 해야 인정돼요.'},
    book: {icon:'📚', color:'#38d6ff', en:'BOOKWORM', ko:'책벌레', unit:'오늘 읽은 쪽수', close:'당일 12:00',    settle:'자정',
           how:'읽을 책 제목과 총 페이지 수를 한 번 적어 두고, 매일 들어와서 몇 쪽까지 읽었는지 인증해요. 그날 읽은 쪽수로 순위를 겨뤄요.'},
    iron: {icon:'💪', color:'#ff5a4a', en:'IRON',     ko:'헬창',   unit:'운동 시간', close:'당일 12:00',    settle:'자정',
           how:'운동할 때 타이머를 켜고 끄면 오늘 운동한 시간이 계속 쌓여요. 오늘의 운동 인증 사진을 찍어야 기록이 인정돼요.'},
    study:{icon:'✏️', color:'#6bff8a', en:'STUDY',    ko:'열공러', unit:'공부 시간', close:'당일 12:00',    settle:'자정',
           how:'카메라를 켜고 라이브로 공부해요. 카메라가 켜져 있는 동안만 시간이 올라가요. (연습용이라 영상은 이 기기에서만 보이고 저장·전송되지 않아요)'}
  },
  // 연습용 가짜 상대: 이름 목록과 기록 범위 (기상은 0시 기준 분, 책벌레는 쪽, 나머지는 분)
  friendNames: ['민지', '준호', '서아', '지우', '하준', '예린', '도윤', '수아', '시우'],
  strangerNames: ['새벽늑대', '독서왕', '철인민수', '공부요정', '아침해', '근육곰', '책갈피', '열공중', '밤샘금지', '갓생러', '하루한장', '스쿼트킹', '집중모드', '오운완', '작심삼일탈출'],
  range: {dawn:[330, 480], book:[5, 60], iron:[20, 90], study:[30, 240]}
};

/* ===== 아래부터는 동작 코드예요. 처음엔 건드리지 않아도 돼요 ===== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const hm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);

/* ===== 캐릭터 그림 (도트 픽셀): 위 look 값으로 그려져요. 'R(x, y, 가로, 세로, 색)'이 칸을 칠하는 명령이에요 ===== */
const PW = 24, PH = 30;   // 도트 캔버스 크기 (가로 24칸, 세로 30칸)
const dk = (c, f) => '#' + [1, 3, 5].map(i => Math.round(parseInt(c.substr(i, 2), 16) * f).toString(16).padStart(2, '0')).join('');
function fighter(o) {
  const G = Array.from({length: PH}, () => Array(PW).fill(null));
  const R = (x, y, w, h, c) => { y += 2; for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (j >= 0 && j < PH && i >= 0 && i < PW) G[j][i] = c; };

  const head = c => { R(6, 3, 12, 1, c); R(5, 4, 14, 1, c); R(4, 5, 16, 8, c); R(5, 13, 14, 1, c); R(6, 14, 12, 1, c); };

  if (acc.includes('cape')) R(5, 15, 14, 8, '#8c1d2c');
  if (acc.includes('scarf')) R(1, 15, 7, 2, RED);
  // 2) 뒤쪽 팔 (낮게 든 주먹)
  R(6, 17, 2, 2, o.gi); R(2, 17, 4, 4, o.glove); R(3, 18, 1, 1, '#fff');
  // 3) 다리, 신발
  R(8, 20, 8, 1, pants); R(8, 21, 3, 3, pants); R(13, 21, 3, 3, pants);
  R(7, 24, 4, 2, o.shoe); R(13, 24, 4, 2, o.shoe);
  // 4) 작은 몸통, 띠

  R(16, 16, 2, 2, o.gi); R(18, 14, 4, 4, o.glove); R(19, 15, 1, 1, '#fff');

  head(o.skin);

  if (acc.includes('horns')) { R(6, 0, 2, 3, o.belt); R(16, 0, 2, 3, o.belt); }
  if (acc.includes('crown')) { R(7, 1, 10, 2, GOLD); R(7, 0, 1, 1, GOLD); R(11, 0, 2, 1, GOLD); R(16, 0, 1, 1, GOLD); R(11, 2, 2, 1, RED); }

function statCard(k) {

const FIGHT = {
  every: 1300,                          // 몇 ms마다 한 번 공격할지
  superChance: 0.15,                    // 필살기(에너지 탄)가 나올 확률
  words: ['POW!', 'BAM!', 'HIT!', 'WHAM!'],
  superWord: 'SUPER!'
};
function bInfo() {
  const L = board(), i = L.findIndex(x => x.me), lead = i === 0, tg = lead ? L[1] : L[i - 1], me = L[i];
  const gap = me.v == null || tg.v == null ? null : Math.abs(me.v - tg.v), u = S.type === 'book' ? '쪽' : '분';
  const msg = me.v == null ? '인증하면 반격할 수 있어요! 지금은 맞기만 해요' : lead ? '1위! ' + tg.n + '이(가) 추격 중 (차이 ' + gap + u + ')' : tg.n + '와(과) ' + (gap == null ? '' : gap + u + ' 차이') + ' · 따라잡아요!';
  return {L, me, tg, msg: (L.length > 2 ? L.length + '명 중 ' + me.rank + '위 · ' : '') + msg};
}
const replay = (el, c) => { el.classList.remove(c); void el.offsetWidth; el.classList.add(c); };
function attack(mine, sp) {
  const a = $(mine ? '#fMe' : '#fRv'), d = $(mine ? '#fRv' : '#fMe'), pow = $('#pow'), ball = $('#ball');
  a.classList.remove('atk', 'hit', 'cast');
  replay(a, sp ? 'cast' : 'atk');
  if (sp) { ball.className = 'ball'; void ball.offsetWidth; ball.className = 'ball ' + (mine ? 'go-r' : 'go-l'); }
  setTimeout(() => {
    if (!d.isConnected) return;
    d.classList.remove('atk', 'hit', 'cast');
    replay(d, 'hit');
    replay($('#ring'), 'shake');
    replay($(mine ? '#hpbRv' : '#hpbMe'), 'flash');
    pow.textContent = sp ? FIGHT.superWord : FIGHT.words[Math.floor(Math.random() * FIGHT.words.length)];
    pow.className = 'pow ' + (mine ? 'r' : 'l') + (sp ? ' sp' : '');
    void pow.offsetWidth; pow.classList.add('on');
  }, sp ? 430 : 180);
}
document.addEventListener('animationend', e => {
  const f = e.target.classList.contains('bd') && e.target.closest('.fx');
  if (f && e.animationName !== 'idle') f.classList.remove('atk', 'hit', 'cast');
});
setInterval(() => {
  if (S.scr !== 'battle' || !$('#fMe') || !S.type) return;
  const {me, tg, msg} = bInfo();
  if ($('#ring').dataset.tg !== tg.n) return go('battle');   // 순위가 바뀌어 상대가 바뀌면 다시 그려요
  $('#hpMe').style.width = (100 - power(tg.v)) + '%';
  $('#hpRv').style.width = (100 - power(me.v)) + '%';
  $('#bmsg').textContent = msg;
  // 기록이 앞설수록 내가 공격할 확률이 높아져요. 인증 전엔 상대만 공격해요.
  const pMe = me.v == null ? 0 : Math.min(0.85, Math.max(0.15, 0.5 + (power(me.v) - power(tg.v)) / 200));
  attack(Math.random() < pMe, Math.random() < FIGHT.superChance);
}, FIGHT.every);

      S.type = k;
      const t = CONFIG.types[k];
      if (!S.rooms[k]) { cards += '<section class="card"><div class="rch"><span style="font-size:30px">' + t.icon + '</span><div><div class="px" style="font-size:9px;color:var(--cyan)">' + t.en + '</div><b>' + t.ko + '</b></div><div class="rbig" style="font-size:16px">방 없음</div></div><p class="sub">이 종목 방에 들어가면 순위가 매겨져요.</p></section>'; return; }
      const L = board(), me = L.find(x => x.me), M = roomMode();
      if (me.v != null) total += me.pts;
      cards += '<section class="card"><div class="rch"><span style="font-size:30px">' + t.icon + '</span><div><div class="px" style="font-size:9px;color:var(--cyan)">' + t.en + '</div><b>' + t.ko + ' · ' + M.icon + ' ' + M.ko + '</b></div>' +
        '<div class="rbig">' + (me.v == null ? '기록 전' : me.rank + '위 · +' + me.pts + '점') + '</div></div>' +
        table(L, true) + claimHtml(me) + '<p class="sub">정산: ' + t.settle + '</p></section>';
    });
    S.type = cur;
    return '<h2>오늘의 결과</h2><div class="share"><div>' + myArt(90) + '</div><div class="big">오늘 승점 +' + total + '</div><div style="font-weight:700;margin-top:4px">🔥 ' + streakInfo().n + '일 연속 인증</div><div class="sub">' + CONFIG.appName + '</div></div>' +
      '<p class="sub">종목마다 따로 순위를 매기고, 코인도 종목별로 받아요. 승점은 배틀 방식마다 달라요.</p>' + cards;
  }
};

function go(scr) {
  if (S.day !== todayKey()) freshDay();   // 자정이 지나면 새 하루
  saveToday();
  saveDay();
  if (!S.type && !['pick', 'chars', 'result', 'my', 'hello'].includes(scr)) scr = 'pick';
  else if ((scr === 'room' || scr === 'battle') && S.type && !S.rooms[S.type]) scr = 'mode';
  S.scr = scr;
  $('#app').innerHTML = SCREENS[scr]();
  streakChip();
  S.msg = '';
  const cv = $('#cam'); if (cv && S.cam) cv.srcObject = S.cam;
  document.querySelectorAll('nav button').forEach(b => {
    if (b.dataset.go === (scr === 'mode' ? 'room' : scr)) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
}

async function startLive() {
  try {
    S.cam = await navigator.mediaDevices.getUserMedia({video: true, audio: false});
    S.studyStart = Date.now();
  } catch (e) {
    S.msg = '카메라를 켤 수 없어요. 카메라 권한을 허용해 주세요.';
  }
  go('proof');
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) return go(g.dataset.go);
  const t = e.target.closest('[data-type]'); if (t) { S.type = t.dataset.type; S.matching = false; return go(S.rooms[S.type] ? 'room' : 'mode'); }
  const dy = e.target.closest('[data-day]'); if (dy) { S.selDay = dy.dataset.day; return go('my'); }
  const ch = e.target.closest('[data-char]');
  if (ch) {
    const c = CONFIG.characters.find(x => x.id === ch.dataset.char);
    if (S.own.includes(c.id)) S.char = c.id;
    else if (S.coins >= c.price) { S.coins -= c.price; S.own.push(c.id); S.char = c.id; S.msg = c.name + ' 획득!'; }
    else S.msg = '코인이 ' + (c.price - S.coins) + '개 부족해요';
    return go('chars');
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'cal') {
    S.calM += Number(a.dataset.d);
    if (S.calM < 0) { S.calM = 11; S.calY--; }
    if (S.calM > 11) { S.calM = 0; S.calY++; }
    return go('my');
  }
  if (act === 'mfriend') { makeRoom(S.type, 'friend'); return go('room'); }
  if (act === 'mjoin') {
    const c = $('#code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!/^GS[A-Z0-9]{4}$/.test(c)) { S.msg = '코드를 정확히 적어 주세요 (예: GS-7K2P)'; return go('mode'); }
    makeRoom(S.type, 'friend', 'GS-' + c.slice(2)); return go('room');
  }
  if (act === 'mroyale') { makeRoom(S.type, 'royale'); return go('room'); }
  if (act === 'mduel') {
    const k = S.type; S.matching = true; go('mode');
    return setTimeout(() => { if (!S.matching || S.type !== k) return; makeRoom(k, 'duel'); S.matching = false; if (S.scr === 'mode') go('room'); }, 1800);
  }
  if (act === 'leave') { delete S.rooms[S.type]; return go('mode'); }
  if (act === 'fadd') {
    const r = S.rooms[S.type], name = CONFIG.friendNames.find(n => !r.members.some(m => m[0] === n));
    if (!name || r.members.length >= CONFIG.modes.friend.max - 1) S.msg = '방이 가득 찼어요';
    else { r.members.push([name, mockVal(S.type)]); S.msg = name + ' 입장!'; }
    return go('room');
  }
  if (act === 'share') {
    const r = S.rooms[S.type], text = CONFIG.appName + ' ' + CONFIG.types[S.type].ko + ' 배틀 방에 들어와! 방 코드: ' + r.code;
    const done = m => { S.msg = m; if (S.scr === 'room') go('room'); };
    if (navigator.share) { navigator.share({title: CONFIG.appName, text}).catch(() => {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => done('초대 문구를 복사했어요. 카톡에 붙여넣어 보내 주세요'), () => done('친구에게 코드를 알려 주세요: ' + r.code));
    else done('친구에게 코드를 알려 주세요: ' + r.code);
    return;
  }
  if (act === 'seed') { seedHist(); return go('my'); }
  if (act === 'delask') { S.delAsk = true; return go('my'); }
  if (act === 'delno') { S.delAsk = false; return go('my'); }
  if (act === 'delacc') { wipeLocal(); return; }
  if (act === 'wipe') { S.hist = {}; saveHist(); S.sClaimed = []; saveClaimed(); return go('my'); }
  if (act === 'sclaim') {
    const m = CONFIG.streak.find(x => x.days === Number(a.dataset.d));
    if (m && streakInfo().n >= m.days && !S.sClaimed.includes(m.days)) { S.coins += m.coin; S.sClaimed.push(m.days); saveClaimed(); S.msg = m.days + '일 연속 보너스 🪙 +' + m.coin + '!'; }
    return go('my');
  }
  if (act === 'coindemo') { S.coins += 50; return go('chars'); }
  if (act === 'claim') {
    const k = a.dataset.k, cur = S.type;
    S.type = k;
    const me = board().find(x => x.me);
    if (me.v != null && !S.claimed[k]) { S.coins += me.pts * CONFIG.coinPerPoint; S.claimed[k] = true; }
    S.type = cur;
    return go('result');
  }
  if (act === 'wake') { const v = $('#wk').value; if (v) { const [h, m] = v.split(':').map(Number); S.v.dawn = h * 60 + m; } }
  if (act === 'bset') {
    const t = $('#bkT').value.trim(), n = parseInt($('#bkN').value, 10);
    if (!t || !(n > 0)) S.msg = '책 제목과 총 페이지 수를 적어 주세요';
    else { S.bk.book = {title: t, total: n, page: 0}; saveBook(); }
  }
  if (act === 'bread') {
    const p = parseInt($('#bkP').value, 10);
    if (isNaN(p)) S.msg = '쪽수를 숫자로 적어 주세요';
    else { readTo(p); S.msg = '인증 완료! 오늘 ' + bookToday() + '쪽'; }
  }
  if (act === 'bnew') { S.bk.book = null; saveBook(); }
  if (act === 'ltoggle') {
    if (!S.cam) return startLive();
    S.v.study += (Date.now() - S.studyStart) / 60000;
    S.cam.getTracks().forEach(t => t.stop());
    S.cam = null; S.studyStart = 0;
  }
  if (act === 'sdemo') S.v.study += 10;
  if (act === 'bdemo' && S.bk.book) readTo(S.bk.book.page + 10);
  if (act === 'itoggle') {
    if (S.ironStart) { S.v.iron += (Date.now() - S.ironStart) / 60000; S.ironStart = 0; } else S.ironStart = Date.now();
  }
  if (act === 'idemo') S.v.iron += 10;
  go('proof');
});
document.addEventListener('input', e => { if (e.target.dataset.bind) S[e.target.dataset.bind] = e.target.value; });
document.addEventListener('change', e => {
  const k = e.target.dataset.ph, f = e.target.files && e.target.files[0];
  if (!k || !f) return;
  photoData(f, url => { S.photo[k] = url; go('proof'); });
});
setInterval(() => {
  if (S.studyStart && Date.now() % 10000 < 1000) saveDay();   // 라이브 중에는 10초마다 저장
  const el = $('#tm');
  if (el && S.type === 'iron') { el.textContent = clock(ironSecs()); return; }
  const st = S.type === 'study' ? S.studyStart : 0;
  if (el && st) { const s = Math.floor((Date.now() - st) / 1000); el.textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
}, 1000);

$('#appName').textContent = CONFIG.appName;
document.title = CONFIG.appName;
document.addEventListener('visibilitychange', saveDay);
window.addEventListener('pagehide', saveDay);
loadDay();
go('pick');
</script>
